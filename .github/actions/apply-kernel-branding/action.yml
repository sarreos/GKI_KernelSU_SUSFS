name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    required: true
  kernel_version:
    required: true
  android_version:
    required: true
  version:
    required: true
  sublevel:
    required: true
  brand_name:
    description: 'Branding text appended to the version (e.g., Wild)'
    required: false
    default: Wild

runs:
  using: composite
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)

        # GitHub commit hash
        GHASH="${GITHUB_SHA:0:13}"

        if [[ ${{ inputs.version }} == "android15-6.6" || ${{ inputs.version }} == "android16-6.12" ]]; then
          KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART-g$GHASH"
          sed -i '$d' scripts/setlocalversion
          echo "echo \"$KERNEL_STRING\"" >> scripts/setlocalversion
        else
          KERNEL_STRING="-$ANDROID_PART-g$GHASH"
          sed -i '$d' scripts/setlocalversion
          echo "echo \"$KERNEL_STRING\"" >> scripts/setlocalversion
        fi

        chmod +x scripts/setlocalversion
